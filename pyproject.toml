[project]
name = "halcon"
version = "0.1.0"
description = "Detección de fraude en pagos en tiempo real: reglas + ML + agente IA"
readme = "README.md"
authors = [{ name = "Fabricio Anchundia" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "prometheus-client>=0.26.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "valkey>=6.2.0",
    "xgboost>=3.4.1",
]

[project.scripts]
halcon = "halcon:main"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "mypy>=1.18",
    "pytest>=8.4",
    "pre-commit>=4.3",
    "fakeredis>=2.40.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*", "valkey", "valkey.*", "fakeredis", "fakeredis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
